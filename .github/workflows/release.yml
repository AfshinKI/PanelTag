name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip
      - name: Check version and JavaScript
        run: |
          node --input-type=module --check < extension/extension.js
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(python3 -c 'import json; print(json.load(open("extension/metadata.json"))["version-name"])')"
          fi
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paneltag-packages
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paneltag-packages
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --title "PanelTag $GITHUB_REF_NAME"
